<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monee — Studio maskot 2.5D</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; background: #f7f7f3; color: #242821; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.025em; }
    p { margin: 0 0 24px; color: #51574b; }
    #stage { display: grid; place-items: center; min-height: 280px; }
    canvas { display: block; max-width: 100%; height: auto !important; touch-action: pan-y; }
    form { display: flex; flex-wrap: wrap; gap: 16px; }
    label { display: grid; gap: 6px; flex: 1 1 180px; }
    select { min-height: 44px; width: 100%; border: 1px solid #8b9283; border-radius: 6px; padding: 8px; color: inherit; background: #fff; font: inherit; }
    select:focus-visible { outline: 2px solid #33501f; outline-offset: 3px; }
    #error { color: #982b23; }
  </style>
</head>
<body>
<main>
  <h1>Studio maskot</h1>
  <p>Preview langsung dari engine Canvas 2.5D aplikasi.</p>
  <div id="stage"><canvas id="mascot" role="img" aria-label="Maskot Mochi"></canvas></div>
  <form>
    <label>Maskot<select id="character"><option value="mochi">Mochi</option><option value="luna">Luna</option><option value="bumi">Bumi</option></select></label>
    <label>Ekspresi<select id="expression"></select></label>
  </form>
  <p id="error" role="alert" hidden></p>
</main>
<script type="module">
  import { MascotCanvas, STATES } from '../../mascots/core/mascot_canvas.js';
  const canvas = document.getElementById('mascot');
  const character = document.getElementById('character');
  const expression = document.getElementById('expression');
  for (const state of STATES) expression.add(new Option(state, state));
  if (!canvas.getContext('2d')) {
    const error = document.getElementById('error');
    error.hidden = false;
    error.textContent = 'Canvas tidak tersedia di browser ini.';
    character.disabled = expression.disabled = true;
  } else {
    const engine = new MascotCanvas({ canvas, mascot: 'mochi', width: 280, state: 'idle' });
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const syncMotion = () => { engine.reduced = motion.matches; };
    syncMotion();
    motion.addEventListener('change', syncMotion);
    character.addEventListener('change', () => {
      engine.setMascot(character.value);
      canvas.setAttribute('aria-label', `Maskot ${character.selectedOptions[0].textContent}`);
    });
    expression.addEventListener('change', () => engine.setState(expression.value));
    window.addEventListener('pagehide', () => { engine.destroy(); motion.removeEventListener('change', syncMotion); }, { once: true });
  }
</script>
</body>
</html>
